name: AgentFlow CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Syntax & E2E Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 23.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax Validation
        run: |
          node --check backend/src/server.js
          node --check backend/src/app.js
          node --check backend/src/db.js
          node --check backend/src/seed.js
          node --check backend/src/seed-data.js
          node --check backend/src/ai/engine.js
          node --check backend/src/middleware/auth.js
          node --check backend/src/middleware/errors.js
          node --check backend/src/middleware/validate.js
          node --check backend/src/routes/auth.js
          node --check backend/src/routes/misc.js
          node --check backend/src/routes/workflows.js
          node --check backend/src/utils/respond.js
          node --check backend/src/utils/tokens.js
          node --check web/app.js
          node --check tests/run-tests.js

      - name: Execute End-to-End Test Suite (50 Fixtures)
        run: node tests/run-tests.js
